<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación – El Penúltimo Baile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@font-face {
    font-family: 'VinerHand';
    src: url('VinerHandITC.ttf') format('truetype');
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ============================
   CARRUSEL (3 IMÁGENES)
   ============================ */
.carousel {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
}

.carousel img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center; /* ⭐ img2 centrada */
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

.carousel img.active {
    opacity: 1;
}

/* ============================
   TÍTULO
   ============================ */
.titulo-superior {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    z-index: 3;
}

.titulo-superior h1,
.titulo-superior h2 {
    font-family: 'VinerHand', sans-serif;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #ffffff;
    text-shadow:
        0px 0px 6px rgba(0,0,0,0.85),
        0px 0px 18px rgba(0,0,0,0.65);
}

.titulo-superior h1 { font-size: 85px; }
.titulo-superior h2 { font-size: 45px; margin-top: -10px; }

/* ============================
   BOTONES
   ============================ */
.boton {
    display: block;
    width: 90%;
    max-width: 260px;
    margin: 15px auto;
    padding: 15px;
    background: rgba(255,255,255,0.10);
    color: #fff;
    font-size: 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    backdrop-filter: blur(4px);
    text-align: center;
}

/* ============================
   BOTONES ABAJO
   ============================ */
.botones-abajo {
    position: absolute;
    bottom: 40px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 40px;
    z-index: 5;
}

.columna {
    width: 45%;
}

/* ============================
   OVERLAY
   ============================ */
.cuando-es-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 9999;
    font-family: 'Quicksand', sans-serif;
}

.cuando-es-overlay h1 {
    font-size: 32px;
    margin-bottom: 20px;
}

.cuando-es-overlay h2 {
    font-size: 22px;
    margin-bottom: 40px;
    opacity: 0.8;
}

#countdown {
    font-size: 45px;
    font-weight: 900;
    margin-top: 30px;
}

.cerrar-overlay {
    margin-top: 40px;
    padding: 12px 25px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    color: white;
    font-size: 18px;
    text-decoration: none;
}

/* ============================
   RESPONSIVE MÓVIL
   ============================ */
@media (max-width: 768px) {

    .carousel {
        width: 100%;
        height: 100vh;
    }

    .carousel img {
        object-fit: cover;
        object-position: center center;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
    }

    .titulo-superior h1 {
        font-size: 38px;
        letter-spacing: 1px;
    }

    .titulo-superior h2 {
        font-size: 22px;
        margin-top: -5px;
    }

    .botones-abajo {
        flex-direction: column;
        align-items: center;
        bottom: 25px;
        padding: 0;
    }

    .columna {
        width: 100%;
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .boton {
        max-width: 240px;
        font-size: 18px;
        padding: 12px;
    }

    .cuando-es-overlay {
        justify-content: center;
        padding: 10px;
    }

    .cuando-es-overlay h1 {
        font-size: 20px;
        line-height: 1.4;
        padding: 0 15px;
    }

    .cuando-es-overlay h2 {
        font-size: 15px;
        margin-bottom: 20px;
    }

    #countdown {
        font-size: 26px;
        margin-top: 15px;
    }

    .cerrar-overlay {
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<!-- ============================
     TÍTULO
     ============================ -->
<div class="titulo-superior">
    <h1>El Penúltimo Baile</h1>
    <h2>Llegaron Mis 50</h2>
</div>

<!-- ============================
     CARRUSEL (3 IMÁGENES)
     ============================ -->
<div class="carousel">
    <img src="img1.jpg" class="active">
    <img src="img2.jpg">
    <img src="img3.jpg">
</div>

<script>
let index = 0;
const imgs = document.querySelectorAll('.carousel img');

setInterval(() => {
    imgs[index].classList.remove('active');
    index = (index + 1) % imgs.length;
    imgs[index].classList.add('active');
}, 4000);
</script>

<!-- ============================
     BOTONES
     ============================ -->
<div class="botones-abajo">

    <div class="columna">
        <a class="boton" id="btnCuandoEs">¿CUANDO ES?</a>

        <a class="boton boton-whatsapp" href="https://wa.me/59899164492?text=Hola,%20confirmo%20mi%20asistencia">
            📱 Confirmar asistencia
        </a>
    </div>

    <div class="columna">
        <a class="boton" href="https://www.google.com/maps/search/?api=1&query=Avenida+Pérez+Bulter+y+Avenida+Costanera+Alto+Pilar+Barbacoa" target="_blank">
            Cómo llegar – <strong>Alto Pilar (Barbacoa)</strong>
        </a>

        <a class="boton" href="https://drive.google.com/drive/folders/1ZYV4_hRpaBB4g4KWKi0_7rsBJQp3LvvS?usp=drive_link" target="_blank">
            Subir fotos
        </a>
    </div>

</div>

<!-- ============================
     OVERLAY
     ============================ -->
<div class="cuando-es-overlay" id="overlayCuandoEs">

    <h1>HAY QUE FESTEJAR EL SÁBADO 17 DE OCTUBRE DEL 2026 A PARTIR DE LAS 21:00 HS HASTA QUE LAS VELAS ARDAN</h1>

    <h2>IMPORTANTE (SOLO ADULTOS)</h2>

    <div id="countdown">Cargando cuenta regresiva...</div>

    <a class="cerrar-overlay" id="cerrarOverlay">Cerrar</a>

</div>

<script>
const btnCuandoEs = document.getElementById("btnCuandoEs");
const overlay = document.getElementById("overlayCuandoEs");
const cerrarOverlay = document.getElementById("cerrarOverlay");

btnCuandoEs.onclick = () => overlay.style.display = "flex";
cerrarOverlay.onclick = () => overlay.style.display = "none";

function actualizarCuentaRegresiva() {
    const evento = new Date("October 17, 2026 21:00:00").getTime();
    const ahora = Date.now();
    const diferencia = evento - ahora;

    if (diferencia <= 0) {
        document.getElementById("countdown").innerHTML = "¡ES HOY!";
        return;
    }

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
        `${dias} DÍAS • ${horas} HS • ${minutos} MIN • ${segundos} SEG`;
}

setInterval(actualizarCuentaRegresiva, 1000);
actualizarCuentaRegresiva();
</script>

<!-- ============================
     AUDIO MP3
     ============================ -->
<audio id="player" src="musica.mp3" autoplay loop></audio>

<script>
const player = document.getElementById("player");
player.play().catch(() => {});
document.addEventListener("click", () => {
    player.play().catch(() => {});
}, { once: true });
</script>

</body>
</html>
