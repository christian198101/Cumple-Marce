<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MIS 50 EL PENULTIMO BAILE (TE LO VAS A PERDER ?)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* OVERLAY CUANDO ES */
.cuando-es-overlay {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: none; 
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 9999;
}

/* BOTÓN CERRAR */
.cerrar-overlay {
    margin-top: 25px;
    padding: 14px 30px;
    background: #ff00ff;
    color: #ffffff;
    border-radius: 12px;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 15px #ff00ff;
}

/* AJUSTE PARA MÓVIL */
@media (max-width: 768px) {
    #overlayCuandoEs {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        display: flex !important;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-y: auto;
        text-align: center;
    }
}
</style>
</head>
<body>

<a class="boton" id="btnCuandoEs">¿CUANDO ES?</a>

<div class="cuando-es-overlay" id="overlayCuandoEs">

    <h1 class="titulo-festejar">¡¡¡HAY QUE FESTEJAR!!!</h1>

    <h2 class="texto-evento">
        El sábado 17 de octubre del 2026<br>
        A partir de las 21:00 hs<br>
        Hasta que las velas ardan
    </h2>

    <h2 class="solo-adultos">
        🚫 <span>IMPORTANTE: SOLO ADULTOS</span>
    </h2>

    <div id="countdown">Cargando cuenta regresiva...</div>

    <!-- ⭐ BOTÓN CERRAR FUNCIONAL ⭐ -->
    <button class="cerrar-overlay" id="cerrarOverlay">Cerrar</button>

</div>

<script>
const btnCuandoEs   = document.getElementById("btnCuandoEs");
const overlay       = document.getElementById("overlayCuandoEs");
const cerrarOverlay = document.getElementById("cerrarOverlay");

/* ABRIR */
btnCuandoEs.addEventListener("click", () => {
    overlay.style.display = "flex";
});

/* CERRAR — AHORA FUNCIONA EN TODOS LOS MÓVILES */
cerrarOverlay.addEventListener("click", () => {
    overlay.style.display = "none";
});

/* CUENTA REGRESIVA */
function actualizarCuentaRegresiva() {
    const evento = new Date("October 17, 2026 21:00:00").getTime();
    const ahora = Date.now();
    const diferencia = evento - ahora;

    if (diferencia <= 0) {
        document.getElementById("countdown").innerHTML = "¡ES HOY!";
        return;
    }

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
        `${dias} DÍAS • ${horas} HS • ${minutos} MIN • ${segundos} SEG`;
}

setInterval(actualizarCuentaRegresiva, 1000);
actualizarCuentaRegresiva();
</script>

</body>
</html>
